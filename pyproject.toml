[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lime-audit"
version = "0.1.0"
description = "Audit LIME explanations for stability and faithfulness on any HuggingFace text classifier"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Parshvi Jain", email = "parshvijain1508@gmail.com"},
]
keywords = ["explainability", "XAI", "LIME", "audit", "NLP", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lime>=0.2",
    "transformers>=4.30",
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.scripts]
lime-audit = "lime_audit.cli:main"

[project.urls]
Homepage = "https://github.com/parshvi1508/XAI_Forensic"
Documentation = "https://github.com/parshvi1508/XAI_Forensic#readme"
Issues = "https://github.com/parshvi1508/XAI_Forensic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lime_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/lime_audit/default_test_set.json" = "lime_audit/default_test_set.json"
